<h1 class="post-heading">我的山海經：一號公路</h1>
<time datetime="2026-08-27T03:32Z">2026/08/27</time>
</header>
<div class="post-body">
<p>八月藍，山海啓程。<br>
臨海餐廳歇腳，夜晚星河璀璨。<br>
太平洋的風醉了一宿。<br>
<br>
<br>
棕櫚樹，一路向南。<br>
佛蘭明歌舞罷，冰淇淋店裏人頭攢動。<br>
墨西哥人吹唱瑪麗亞其。<br>
<br>
<br>
夕陽下的天使城，<br>
灞橋折柳，在路上。<br></p>
